<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project · Portfolio</title>
    <link rel="stylesheet" href="/assets/css/style.css">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
</head>

<body>
    <div id="header"></div>
    <main>
        <div class="wrap">
            <div id="project-page"></div>
        </div>
    </main>
    <div id="footer"></div>
    <script src="/assets/js/source-data.js"></script>
    <script src="/assets/js/main.js"></script>
    <script>DATA_READY.then(() => { const slug = new URLSearchParams(location.search).get("slug"); const project = PROJECTS.find(p => p.slug === slug); const page = renderProjectPage(project); document.title = `${page.title} · Portfolio`; mount("header", renderHeader("projects")); updateThemeIcon(); mount("project-page", `<div class="crumbs"><a href="/">Home</a> &gt; <a href="/projects">Projects</a> &gt; ${escapeHtml(page.crumb)}</div>${page.body}`); mount("footer", renderFooter()); }).catch(console.error);</script>
</body>

</html>
