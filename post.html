<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Post · Portfolio</title>
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <div id="header"></div>

  <main>
    <div class="wrap">
      <div class="crumbs"><a href="index.html">Home</a> &gt; <a href="posts.html">Posts</a> &gt; <span id="crumb-title"></span></div>
      <h1 id="post-title"></h1>
      <div class="post-meta" id="post-meta"></div>
      <div class="about-body" id="post-body" style="margin-top:2rem;"></div>
    </div>
  </main>

  <div id="footer"></div>

  <script src="assets/js/source-data.js"></script>
  <script src="assets/js/main.js"></script>
  <script>
    DATA_READY.then(() => {
    mount("header", renderHeader("posts"));
    updateThemeIcon();
    const slug = new URLSearchParams(window.location.search).get("slug");
    const post = POSTS.find((p) => p.slug === slug) || POSTS[0];

    if (post) {
      document.title = post.title + " · Portfolio";
      document.getElementById("crumb-title").textContent = post.title;
      document.getElementById("post-title").textContent = post.title;
      document.getElementById("post-meta").innerHTML = `${ICONS.calendar}<span>Posted on: <em>${escapeHtml(getPostDateText(post))}</em></span>`;
      document.getElementById("post-body").innerHTML = post.body;
    } else {
      document.getElementById("crumb-title").textContent = "Not found";
      document.getElementById("post-title").textContent = "No posts yet";
      document.getElementById("post-body").innerHTML =
        "<p>There's nothing here yet — check back soon.</p>";
    }

    mount("footer", renderFooter());
      }).catch((error) => {
      console.error(error);
    });
</script>
</body>
</html>
