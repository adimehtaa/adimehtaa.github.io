<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Project · Portfolio</title>
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <div id="header"></div>
  <main>
    <div class="wrap">
      <div class="crumbs"><a href="index.html">Home</a> &gt; <a href="projects.html">Projects</a> &gt; <span id="crumb-title"></span></div>
      <div id="project-page"></div>
    </div>
  </main>
  <div id="footer"></div>
  <script src="assets/js/source-data.js"></script>
  <script src="assets/js/main.js"></script>
  <script>
    DATA_READY.then(() => {
    mount("header", renderHeader("projects"));
    updateThemeIcon();
    const slug = new URLSearchParams(window.location.search).get("slug");
    const project = PROJECTS.find((item) => item.slug === slug);
    const page = renderProjectPage(project);
    document.title = `${page.title} · Portfolio`;
    document.getElementById("crumb-title").textContent = page.crumb;
    mount("project-page", page.body);
    mount("footer", renderFooter());
      }).catch((error) => {
      console.error(error);
    });
</script>
</body>
</html>
