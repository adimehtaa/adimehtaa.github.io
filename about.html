<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>About · Portfolio</title>
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <div id="header"></div>

  <main>
    <div class="wrap">
      <div class="crumbs"><a href="index.html">Home</a> &gt; About</div>
      <h1>About</h1>

      <div class="portrait-wrap" id="portrait-wrap"></div>
      <div class="portrait-credit" id="portrait-credit"></div>

      <div class="about-body" id="about-paragraphs"></div>

      <h2>Experience</h2>
      <div id="experience"></div>

      <h2>Skills</h2>
      <div id="skills"></div>

      <h2>Education</h2>
      <div id="education"></div>

      <h2 id="website-heading"></h2>
      <div class="about-body" id="website-paragraph"></div>
    </div>
  </main>

  <div id="footer"></div>

  <script src="assets/js/source-data.js"></script>
  <script src="assets/js/main.js"></script>
  <script>
    DATA_READY.then(() => {
      mount("header", renderHeader("about"));
      updateThemeIcon();

      mount(
        "portrait-wrap",
        ABOUT.portrait
          ? `<button class="portrait-trigger" type="button" data-lightbox-src="${ABOUT.portrait}" data-lightbox-alt="Portrait of ${SITE.name}" aria-label="Open portrait image">
               <img class="portrait" src="${ABOUT.portrait}" alt="Portrait of ${SITE.name}" />
             </button>`
          : `<div class="portrait-placeholder">add a portrait image path in source-data.js → ABOUT.portrait</div>`
      );
    mount(
      "portrait-credit",
      ABOUT.portraitCredit
        ? `portrait by <a href="${ABOUT.portraitCreditUrl}">${ABOUT.portraitCredit}</a>`
        : ""
    );

    mount(
      "about-paragraphs",
      ABOUT.paragraphs.map((p) => `<p>${p}</p>`).join("")
    );

    mount("experience", renderExperience());
    mount("skills", renderSkills());
    mount("education", renderEducation());

    document.getElementById("website-heading").textContent = ABOUT.websiteHeading;
    mount("website-paragraph", `<p>${ABOUT.websiteParagraph}</p>`);

      mount("footer", renderFooter());
    }).catch((error) => {
      console.error(error);
      document.getElementById("about-paragraphs").innerHTML =
        "<p>Content could not be loaded. Please refresh the page.</p>";
    });
  </script>
</body>
</html>
