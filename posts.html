<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Posts · Portfolio</title>
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <div id="header"></div>

  <main>
    <div class="wrap">
      <div class="crumbs"><a href="index.html">Home</a> &gt; Posts</div>
      <h1>Posts</h1>
      <p style="color:var(--muted);font-style:italic;margin-top:-0.5rem;">All the articles I've posted.</p>
      <div id="posts-list" style="margin-top:2rem;"></div>
    </div>
  </main>

  <div id="footer"></div>

  <script src="assets/js/source-data.js"></script>
  <script src="assets/js/main.js"></script>
  <script>
    DATA_READY.then(() => {
    mount("header", renderHeader("posts"));
    updateThemeIcon();
    mount("posts-list", POSTS.map(renderPostItem).join(""));
    mount("footer", renderFooter());
      }).catch((error) => {
      console.error(error);
    });
</script>
</body>
</html>
